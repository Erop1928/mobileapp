name: Android APK

on:
  push:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-deps-${{ runner.os }}-
      # Keeps the debug signature stable across runs, so a new APK installs over the previous one.
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      # versionName/versionCode come from the latest tag, so each build gets its own: 1.<n/1000>.<n%1000>.
      - name: Tag build version
        run: |
          n=${{ github.run_number }}
          tag="1.$((n / 1000)).$((n % 1000))"
          echo "BUILD_TAG=$tag" >> "$GITHUB_ENV"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              tag -a "$tag" -m "Build $tag"
      - name: Use dummy google-services json
        run: mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
      - name: Build APK
        run: ./gradlew :androidApp:assembleDebug
      - name: Save debug keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coreapp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: libpebble3/schema/
      - name: Unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest jvmTest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            echo "Release $BUILD_TAG already exists"
            exit 0
          fi
          git push origin "refs/tags/$BUILD_TAG"
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk coreapp-debug.apk
          gh release create "$BUILD_TAG" coreapp-debug.apk --verify-tag \
            --title "Build $BUILD_TAG ($GITHUB_REF_NAME)" \
            --notes "$(git log -1 --format=%s) ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})"
      # Room exports schemas while generating code; print new ones so they can be committed.
      - name: Report uncommitted Room schemas
        run: |
          ./gradlew :libpebble3:kspAndroidMain --rerun :libpebble3:copyRoomSchemas --quiet
          files=$(git ls-files --others --exclude-standard -- '*.json' | grep -E '/schemas?/' || true)
          [ -n "$files" ] || files=$(find libpebble3/build -name '*.json' -path '*schemas*' | head -5)
          for f in $files; do
            echo "::warning::Room schema $f is not committed"
            echo "$f gzip+base64: $(gzip -9c "$f" | base64 -w0)"
          done
